<!DOCTYPE html>
<html lang="tr" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IHS Film & Dizi</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
:root{--bg:#0b0b0f;--panel:#14141a;--red:#e50914;--muted:#8a8a96;--line:#25252e;--gold:#f5c518;--safe:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;outline:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
body{background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100dvh}
body.lock{overflow:hidden}
::-webkit-scrollbar{width:8px;height:6px}::-webkit-scrollbar-thumb{background:#33333d;border-radius:8px}
button{font-family:inherit}
.ban{display:none;position:fixed;inset:0;z-index:99999;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;color:var(--red);gap:14px}.ban i{font-size:60px}
.app{display:block}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:calc(10px + var(--safe)) 4vw 10px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;background:linear-gradient(rgba(11,11,15,.95),rgba(11,11,15,.55));backdrop-filter:blur(12px)}
.nav.solid{background:rgba(11,11,15,.97);border-bottom:1px solid var(--line)}
.menu{display:flex;gap:6px}
.menu button{background:none;border:none;color:#bbb;font-weight:700;font-size:14px;padding:8px 12px;border-radius:8px;cursor:pointer}
.menu button:hover{color:#fff}.menu button.on{color:#fff;background:rgba(255,255,255,.1)}
.search{margin-left:auto;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border:1px solid #33333d;border-radius:30px;padding:9px 16px;min-width:230px}
.search:focus-within{border-color:var(--red)}
.search input{background:transparent;border:none;color:#fff;width:100%;font-size:14px}.search i{color:var(--muted)}
.hero{position:relative;min-height:62vh;display:flex;align-items:flex-end;padding:120px 4vw 50px;background:#111 center/cover no-repeat}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,11,15,.96) 5%,rgba(11,11,15,.4) 55%,transparent),linear-gradient(0deg,var(--bg),transparent 45%)}
.hero-in{position:relative;max-width:560px}
.hero-tag{font-size:12px;font-weight:800;letter-spacing:3px;color:var(--red);margin-bottom:10px}
.hero h1{font-size:clamp(28px,5vw,52px);line-height:1.1;margin-bottom:12px;text-shadow:0 3px 12px #000}
.hero-meta{display:flex;gap:14px;color:#ccc;font-weight:600;font-size:14px;margin-bottom:14px;flex-wrap:wrap}.hero-meta .st{color:var(--gold)}
.hero p{color:#ddd;line-height:1.55;font-size:15px;margin-bottom:22px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap}.hero.off{display:none}
.top-space{height:calc(88px + var(--safe))}
.bar{padding:16px 4vw 6px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.bar::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:var(--panel);color:#bbb;border:1px solid var(--line);padding:8px 16px;border-radius:30px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.chip:hover{color:#fff;border-color:#555}.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.chip.sm{padding:6px 12px;min-width:36px;text-align:center}
.sec-h{padding:14px 4vw 4px;font-size:20px;font-weight:800;display:flex;align-items:baseline;gap:10px}.sec-h small{color:var(--muted);font-size:13px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 14px;padding:14px 4vw 60px}
.card{cursor:pointer}
.poster{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--panel);border:1px solid var(--line);transition:transform .25s,box-shadow .25s,border-color .25s}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.card:hover .poster{transform:translateY(-6px) scale(1.03);border-color:var(--red);box-shadow:0 14px 30px rgba(0,0,0,.7),0 0 18px rgba(229,9,20,.3)}
.play-ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);opacity:0;transition:.25s}
.play-ov i{font-size:30px;color:#fff;background:var(--red);width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding-left:4px}
.card:hover .play-ov{opacity:1}
.rt{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.75);color:var(--gold);font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px}
.fv{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.65);border:none;color:#ddd;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.fv.on{color:var(--red)}.fv:hover{background:var(--red);color:#fff}
.resume{position:absolute;left:0;right:0;bottom:0;background:var(--red);font-size:10px;font-weight:800;text-align:center;padding:3px 0;letter-spacing:1px}
.kind-tag{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.75);font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px}
.ct{margin-top:9px;font-size:13px;font-weight:700;color:#eee;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cy{font-size:12px;color:var(--muted);margin-top:2px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 20px;line-height:1.6}
.sentinel{height:2px}
.drawer{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.7);display:none;justify-content:flex-end}.drawer.open{display:flex}
.drawer-in{width:min(420px,100%);height:100%;background:var(--panel);display:flex;flex-direction:column;border-left:1px solid var(--line)}
.dr-h{padding:calc(14px + var(--safe)) 16px 14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.dr-h input{flex:1;min-width:0;background:#0b0b0f;border:1px solid #33333d;border-radius:8px;color:#fff;padding:9px 12px;font-size:14px}
.dr-h button{background:none;border:none;color:#fff;font-size:22px;cursor:pointer}
.dr-l{flex:1;overflow-y:auto;padding:12px}
.dr-i{display:flex;justify-content:space-between;padding:13px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;color:#ddd}
.dr-i small{color:var(--muted)}.dr-i:hover,.dr-i.on{background:rgba(229,9,20,.18);color:#fff}
.ptoast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:rgba(20,20,26,.95);border:1px solid #33333d;padding:10px 18px;border-radius:20px;font-size:13px;z-index:99000;opacity:0;pointer-events:none;transition:.25s}.ptoast.show{opacity:1}

/* detay */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);z-index:60000;display:none;align-items:center;justify-content:center;padding:12px}.modal.open{display:flex}
.mcard{width:100%;max-width:1000px;max-height:94dvh;background:#101015;border:1px solid rgba(255,255,255,.08);border-radius:20px;position:relative;display:flex;flex-direction:column;overflow:hidden;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(14px)}}
.mclose{position:absolute;top:12px;right:12px;z-index:50;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;border:1px solid rgba(255,255,255,.15);cursor:pointer}.mclose:hover{background:var(--red)}
.ml{display:flex;flex-direction:column;overflow-y:auto}
.mv{position:relative;flex-shrink:0;background:#050507}
.mv img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.trailer{position:absolute;inset:0;background:#000;z-index:10;display:none}.trailer.show{display:block}.trailer iframe{width:100%;height:100%;border:0}
.mc{padding:22px;flex:1;min-width:0}
.mc h2{font-size:26px;margin-bottom:4px;padding-right:40px}
.tagline{color:var(--muted);font-style:italic;font-size:13px;margin-bottom:10px}
.mm{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;color:#bbb;margin:10px 0 16px;font-weight:600}.mm span{background:rgba(255,255,255,.07);padding:4px 10px;border-radius:6px}
.ma{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}#md-fav.on{color:var(--red)}
.vchips{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}.vchips small{color:var(--muted);font-weight:700;font-size:12px}
.ov{font-size:14px;line-height:1.65;color:#ddd;margin-bottom:22px}
.mc h4{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--line);padding-bottom:8px;margin:6px 0 12px}
.sec{margin-bottom:22px}
.lang-row,.sea-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}
.eps{display:flex;flex-direction:column;gap:8px;max-height:none}
.ep{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;background:#17171d;border:1px solid var(--line);cursor:pointer}
.ep:hover{border-color:var(--red);background:#1d1d25}
.ep-img{width:124px;aspect-ratio:16/9;border-radius:8px;background:#0b0b0f center/cover;flex-shrink:0;display:none}
.ep.has-img .ep-img{display:block}.ep.has-img .ep-num{display:none}
.ep-num{width:38px;text-align:center;font-weight:800;font-size:18px;color:var(--muted);flex-shrink:0}
.ep-b{flex:1;min-width:0}
.ep-t{font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ep-d{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep-p{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;padding-left:2px}
.ep:hover .ep-p{background:var(--red)}
.tag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;background:rgba(255,255,255,.1);color:#ddd}.tag.seen{color:#4ade80}.tag.res{background:var(--red);color:#fff}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.info-grid div{background:#17171d;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.info-grid small{display:block;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.info-grid b{font-size:13px;font-weight:600;color:#eee}
.cast,.sim{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px}
.person{text-align:center;flex:0 0 76px}
.person img{width:70px;height:70px;border-radius:14px;object-fit:cover;background:#222;margin-bottom:6px}
.person b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person small{font-size:10px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sim-c{flex:0 0 100px;cursor:pointer}
.sim-c img{width:100px;aspect-ratio:2/3;object-fit:cover;border-radius:8px;background:#222;border:1px solid var(--line);display:block}
.sim-c:hover img{border-color:var(--red)}
.sim-c b{display:block;font-size:11px;margin-top:5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* oynatıcı */
.player{position:fixed;inset:0;z-index:70000;background:#000;display:none}.player.open{display:block}
.vc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.vc video{width:100%;height:100%;object-fit:contain}
.p-top{position:absolute;top:0;left:0;right:0;padding:calc(14px + var(--safe)) 18px 36px;background:linear-gradient(rgba(0,0,0,.9),transparent);display:flex;align-items:center;gap:14px;z-index:22;transition:opacity .35s}
.p-top .back{background:rgba(255,255,255,.12);border:none;color:#fff;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:16px;flex-shrink:0}.p-top .back:hover{background:var(--red)}
.p-title{font-size:16px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-actions{display:flex;gap:8px}
.pbtn{background:rgba(255,255,255,.12);border:none;color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer}.pbtn:hover{background:var(--red)}
.controls{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(0,0,0,.95),transparent);padding:50px 22px calc(14px + env(safe-area-inset-bottom,0px));z-index:22;transition:opacity .35s}
.vc.idle .p-top,.vc.idle .controls{opacity:0;pointer-events:none}.vc.idle{cursor:none}
.prog{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.time{font-size:12px;font-family:monospace;color:#ccc;min-width:46px;text-align:center}
.seek{flex:1;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.25);height:5px;border-radius:5px;cursor:pointer}
.seek::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--red)}
.seek::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:var(--red)}
.cb{display:flex;justify-content:space-between;align-items:center}.cl{display:flex;align-items:center;gap:18px}
.ctrl{background:none;border:none;color:#fff;font-size:19px;cursor:pointer}.ctrl:hover{color:var(--red)}.ctrl.big{font-size:28px;width:32px}
.speed{font-size:13px;font-weight:800;min-width:40px}
.vol{display:flex;align-items:center;gap:8px}
.vs{width:80px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.3);height:4px;border-radius:4px}
.vs::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff}
.tap{position:absolute;top:80px;bottom:110px;width:35%;z-index:10;display:flex;align-items:center;justify-content:center;user-select:none}
.tl{left:0}.tr{right:0}.vc.embed .tap{display:none}
.ind{background:rgba(0,0,0,.7);font-weight:700;padding:12px 20px;border-radius:25px;opacity:0;pointer-events:none}
.ind.show{animation:ft .6s forwards}@keyframes ft{0%{opacity:1}100%{opacity:0}}
.next-ov{position:absolute;inset:0;background:rgba(0,0,0,.88);z-index:26;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.an-count{font-size:40px;font-weight:800;color:var(--red)}
.an-name{font-size:19px;font-weight:800;max-width:80%;margin-bottom:10px}
.spinner{position:absolute;top:50%;left:50%;margin:-25px 0 0 -25px;width:50px;height:50px;border:4px solid rgba(255,255,255,.12);border-top-color:var(--red);border-radius:50%;animation:sp 1s linear infinite;z-index:15;display:none;pointer-events:none}
@keyframes sp{to{transform:rotate(360deg)}}
.err{position:absolute;inset:0;background:rgba(0,0,0,.9);z-index:16;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:12px}.err i{font-size:46px;color:var(--red)}
.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(20,20,26,.95);border:1px solid #33333d;padding:9px 16px;border-radius:20px;font-size:13px;z-index:30;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}.toast.show{opacity:1}
@media(min-width:768px){
 .ml{flex-direction:row;overflow:hidden}.mv{width:320px}.mv img{aspect-ratio:auto;height:100%;min-height:100%}
 .mc{overflow-y:auto;padding:34px}.mc h2{font-size:32px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:26px 18px}
}
@media(max-width:640px){
 .nav{gap:10px;padding-bottom:12px}.search{order:3;width:100%;margin-left:0}
 .top-space{height:calc(132px + var(--safe))}.hero{padding-top:150px;min-height:56vh}
 .vs{display:none}.cl{gap:14px}.ma .btn.red{flex:1}.ep-img{width:96px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="ban" id="ban"><i class="fas fa-ban"></i><h1>ERİŞİM ENGELLENDİ</h1></div>

<div class="app" id="app">
  <header class="nav" id="nav">
    <div class="brand">IHS<span>FLIX</span></div>
    <nav class="menu">
      <button id="tab-movie" class="on"><i class="fas fa-film"></i> Filmler</button>
      <button id="tab-series"><i class="fas fa-clapperboard"></i> Diziler</button>
    </nav>
    <label class="search"><i class="fas fa-search"></i><input type="text" id="q" placeholder="Film ara"></label>
  </header>
  <section class="hero off" id="hero"><div class="hero-in">
    <div class="hero-tag" id="h-tag">ÖNE ÇIKAN</div><h1 id="h-title"></h1><div class="hero-meta" id="h-meta"></div><p id="h-ov"></p>
    <div class="hero-btns"><button class="btn red" id="h-play"><i class="fas fa-play"></i> <span>Oynat</span></button><button class="btn" id="h-info"><i class="fas fa-circle-info"></i> Detay</button></div>
  </div></section>
  <div class="top-space" id="space"></div>
  <div class="bar" id="bar"></div>
  <div class="sec-h"><span id="sec-t">Tümü</span><small id="sec-c"></small></div>
  <main class="grid" id="grid"></main>
  <div class="sentinel" id="sentinel"></div>
</div>

<div class="drawer" id="drawer"><div class="drawer-in">
  <div class="dr-h"><input type="text" id="dr-q" placeholder="Kategori ara"><button id="dr-x" aria-label="Kapat"><i class="fas fa-times"></i></button></div>
  <div class="dr-l" id="dr-l"></div>
</div></div>
<div class="ptoast" id="ptoast"></div>

<div class="modal" id="modal" aria-hidden="true"><div class="mcard" role="dialog" aria-modal="true">
  <button class="mclose" id="mclose" aria-label="Kapat"><i class="fas fa-times"></i></button>
  <div class="ml">
    <div class="mv"><img id="md-img" src="" alt=""><div class="trailer" id="trailer"></div></div>
    <div class="mc" id="mc">
      <h2 id="md-title"></h2>
      <div class="tagline" id="md-tag"></div>
      <div class="mm" id="md-meta"></div>
      <div class="ma">
        <button class="btn red" id="md-play"><i class="fas fa-play"></i> <span>Oynat</span></button>
        <button class="btn" id="md-trailer"><i class="fab fa-youtube"></i> Fragman</button>
        <button class="btn" id="md-fav" aria-label="Favori"><i class="far fa-heart"></i></button>
      </div>
      <div class="vchips" id="vchips" hidden></div>
      <p class="ov" id="md-ov"></p>
      <section class="sec" id="sea-sec" hidden><h4>Bölümler</h4><div class="lang-row" id="lang-row"></div><div class="sea-bar" id="sea-bar"></div><div class="eps" id="eps"></div></section>
      <section class="sec" id="info-sec" hidden><h4>Bilgiler</h4><div class="info-grid" id="info"></div></section>
      <section class="sec" id="cast-sec" hidden><h4>Oyuncular</h4><div class="cast" id="cast"></div></section>
      <section class="sec" id="sim-sec" hidden><h4>Benzer içerikler</h4><div class="sim" id="sim"></div></section>
    </div>
  </div>
</div></div>

<div class="player" id="player"><div class="vc" id="vc">
  <div class="p-top">
    <button class="back" id="p-back" aria-label="Geri"><i class="fas fa-arrow-left"></i></button>
    <div class="p-title" id="ptitle"></div>
    <div class="p-actions"><button class="pbtn" id="b-pip" title="Yüzen ekran"><i class="fas fa-clone"></i></button><button class="pbtn" id="b-full" title="Tam ekran"><i class="fas fa-expand"></i></button></div>
  </div>
  <div class="tap tl" id="tap-l"><div class="ind" id="ind-l"><i class="fas fa-backward"></i> 10 sn</div></div>
  <div class="tap tr" id="tap-r"><div class="ind" id="ind-r"><i class="fas fa-forward"></i> 10 sn</div></div>
  <div class="spinner" id="spin"></div>
  <div class="err" id="err"><i class="fas fa-exclamation-triangle"></i><p id="err-t">Yayına ulaşılamıyor</p><button class="btn red" id="retry">Tekrar dene</button></div>
  <div class="next-ov" id="nov"><div>Sıradaki başlıyor</div><div class="an-count" id="an-count">5</div><div class="an-name" id="an-name"></div><button class="btn" id="cancel">İptal</button></div>
  <div class="toast" id="toast" role="status"></div>
  <video id="video" playsinline webkit-playsinline preload="auto"></video>
  <div class="controls" id="controls">
    <div class="prog"><span class="time" id="cur">0:00</span><input type="range" class="seek" id="seek" value="0" step="0.1" aria-label="Süre"><span class="time" id="tot">0:00</span></div>
    <div class="cb"><div class="cl">

const epLabel = e => e.season + '. Sezon ' + e.ep + '. Bölüm';
function contEp(s) {
  const list = showEps(s), last = store.get('ihs_last_' + s.name);
  const i = last ? list.findIndex(e => e.url === last) : -1;
  if (i < 0) return list[0];
  if (resumeOf(list[i].url) > 30 || !seenOf(list[i].url)) return list[i];
  return list[i + 1] || list[i];
}
function playLabel(it) {
  if (it.kind === 'tv') {
    const prevLang = dLang; dLang = store.get('ihs_lang', 'Dublaj'); if (!it.langs.includes(dLang)) dLang = it.langs[0] || '';
    const e = contEp(it); dLang = prevLang;

/* --- bölüm ekranı --- */
let epToken = 0; const seasonCache = {};
function renderLangRow(s) {
  const box = $('lang-row'); box.innerHTML = '';

  box.style.display = 'flex';
  s.langs.forEach(l => {
    const b = mk('button', 'chip' + (l === dLang ? ' on' : ''), l === 'Dublaj' ? 'Türkçe Dublaj' : 'Türkçe Altyazı');
    b.onclick = () => {
      dLang = l; store.set('ihs_lang', l);
      const seasons = [...new Set(showEps(s).map(e => e.season))]; if (!seasons.includes(dSeason)) dSeason = seasons[0];

function renderSeasonBar(s) {

async function loadSeasonMeta(s, n) {

  try { const r = await fetchRetry(`${TMDB}/tv/${s.tmdbId}/season/${n}?api_key=${CONFIG.tmdbKey}&language=tr-TR`); seasonCache[k] = r.ok ? await r.json() : null; }
  catch { seasonCache[k] = null; }

function renderEpisodes(s) {
  const box = $('eps'); box.innerHTML = ''; const tk = ++epToken;
  const list = showEps(s).filter(e => e.season === dSeason);
  if (!list.length) { box.innerHTML = '<div class="empty" style="padding:20px">Bu sezonda bölüm bulunamadı.</div>'; return; }
  const rows = [];
  list.forEach(e => {
    const row = mk('div', 'ep'); row._e = e;
    const num = mk('div', 'ep-num', e.ep || '–'), im = mk('div', 'ep-img');
    const b = mk('div', 'ep-b'), t = mk('div', 'ep-t'), d = mk('div', 'ep-d');
    t.appendChild(mk('span', 'ep-name', (e.ep ? e.ep + '. Bölüm' : 'Bölüm')));
    const rs = resumeOf(e.url);
    if (rs > 30) t.appendChild(mk('span', 'tag res', 'KALDIĞIN YER ' + fmt(rs)));
    else if (seenOf(e.url)) t.appendChild(mk('span', 'tag seen', '✓ İZLENDİ'));
    b.append(t, d);
    const p = mk('div', 'ep-p'); p.innerHTML = '<i class="fas fa-play"></i>';
    row.append(num, im, b, p);
    row.onclick = () => playEpisode(s, e);
    box.appendChild(row); rows.push(row);
  });
  loadSeasonMeta(s, dSeason).then(m => {
    if (tk !== epToken || !m || !m.episodes) return;
    const nums = list.map(e => e.ep), mn = Math.min(...nums), mx = Math.max(...nums);
    if (mn !== 1 || mx > m.episodes.length) return;
    const by = {}; m.episodes.forEach(x => by[x.episode_number] = x);
    rows.forEach(row => {
      const x = by[row._e.ep]; if (!x) return;
      row.querySelector('.ep-name').textContent = row._e.ep + '. ' + (x.name || 'Bölüm');
      if (x.overview) row.querySelector('.ep-d').textContent = x.overview;

/* ===== OYNATMA GİRİŞLERİ ===== */
function verFor(m, idx) {
  if (idx !== undefined && m.versions[idx]) return m.versions[idx];
  const pl = store.get('ihs_lang', 'Dublaj'); return m.versions.find(v => v.lang === pl) || m.versions[0];
}
function quickPlay(item, ver) {
  if (item.kind === 'tv') {
    const prevLang = dLang; dLang = store.get('ihs_lang', 'Dublaj'); if (!item.langs.includes(dLang)) dLang = item.langs[0] || '';
    const e = contEp(item); const lang = dLang; dLang = prevLang;
    if (!e) return notify('Oynatılacak bölüm yok');
    dLang = lang; playEpisode(item, e); return;
  }
  const list = display.includes(item) ? display : [item];
  const q = list.map(m => ({ url: verFor(m, m === item ? ver : undefined).url, title: m.name, item: m }));
  closeDetail(); startPlay(q, list.indexOf(item), true);
}
function playEpisode(s, e) {
  const list = showEps(s);
  const q = list.map(x => ({ url: x.url, title: s.name + ' · ' + epLabel(x), item: s, ep: x }));
  store.set('ihs_last_' + s.name, e.url);
  closeDetail(); startPlay(q, list.indexOf(e), false);
}
function startPlay(q, i, loop) { queue = q; queue.loop = loop; qIndex = i; playStream(q[i]); }

/* ===== OYNATICI ===== */
const fmt = s => {
  if (!isFinite(s)) return '0:00';
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = Math.floor(s % 60), p = n => String(n).padStart(2, '0');
  return h ? `${h}:${p(m)}:${p(sec)}` : `${m}:${p(sec)}`;
};
function toast(m) { const el = $('toast'); el.textContent = m; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 3200); }
function togglePlay() { if (video.paused) video.play().catch(() => {}); else video.pause(); }
function mediaEnd() {
  if (isFinite(video.duration) && video.duration > 0) return video.duration;
  const r = video.seekable; return r && r.length ? r.end(r.length - 1) : 0;
}
function seekBy(d) { seekTo(video.currentTime + d); }
function seekTo(t) {
  const end = mediaEnd();
  if (!activeP || !end) { toast('Süre bilgisi henüz yüklenmedi'); return; }
  t = Math.max(0, Math.min(end - 1, t)); video.currentTime = t;
  clearTimeout(seekTimer); seekTimer = setTimeout(() => checkSeek(t, 0), 2500);
}
function checkSeek(t, tries) {
  if (!activeP) return;
  const diff = video.currentTime - t;
  if (diff >= -3 && diff < 20) return;
  if (video.seeking && tries < 3) { seekTimer = setTimeout(() => checkSeek(t, tries + 1), 2500); return; }
  if (!activeP._seekProxy && !usedProxy && !embedFor(activeP.url)) {
    activeP._seekProxy = true; toast('Sarma desteklenmiyor, yedek yol deneniyor…'); playStream(activeP, true, t);
  } else toast('Bu kaynak ileri/geri sarmayı desteklemiyor');
}
function animateTap(id) { const el = $(id); el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); }
function step(dir) {
  if (!queue.length) return;
  const n = qIndex + dir;
  if (n < 0 || n >= queue.length) { if (!queue.loop) return toast(dir > 0 ? 'Son bölüm' : 'İlk bölüm'); }
  qIndex = (n + queue.length) % queue.length; playStream(queue[qIndex]);
}
function cancelAutoNext() { clearInterval(autoTimer); $('nov').style.display = 'none'; }
function toggleFullscreen() {
  const p = $('player');
  if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else if (p.requestFullscreen) p.requestFullscreen().catch(() => {});
  else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
}
function showError(msg) { spin.style.display = 'none'; $('err').style.display = 'flex'; if (msg) $('err-t').textContent = msg; }
function stopPlayback() {
  cancelAutoNext();
  if (hls) { hls.destroy(); hls = null; }
  const f = $('ihs-iframe'); if (f) f.remove();
  video.pause(); video.removeAttribute('src'); video.load();
  video.playbackRate = 1; $('speed').textContent = '1x';
  vc.classList.remove('embed'); video.style.display = 'block'; $('controls').style.display = 'block';
  spin.style.display = 'none'; $('err').style.display = 'none';
}
function closePlayer(silent) {
  if (!$('player').classList.contains('open')) return;
  const p = activeP;
  if (p && video.currentTime > 5) store.set('ihs_resume_' + p.url, video.currentTime);
  stopPlayback(); activeP = null; queue = []; qIndex = -1;
  $('player').classList.remove('open'); document.body.classList.remove('lock');
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  if (silent) return;
  if (p && p.item && p.item.kind === 'tv') { dSeason = p.ep.season; openDetail(p.item); }
  else if (category === 'Devam Et') renderGrid(true);
}
function markProgress() {
  if (!activeP) return;
  const end = mediaEnd();
  if (end && video.currentTime / end > 0.9) { store.set('ihs_seen_' + activeP.url, '1'); }
}

function setupPlayer() {
  const pp = $('pp'), mute = $('mute'), vol = $('vol'), seek = $('seek');
  let seeking = false, lastSave = 0;
  $('p-back').onclick = () => closePlayer();
  pp.onclick = e => { e.stopPropagation(); togglePlay(); };
  $('prev').onclick = () => step(-1); $('next').onclick = () => step(1);
  $('back10').onclick = () => seekBy(-10); $('fwd10').onclick = () => seekBy(10);
  $('b-full').onclick = toggleFullscreen;
  $('b-pip').onclick = () => { if (document.pictureInPictureElement) document.exitPictureInPicture(); else if (document.pictureInPictureEnabled) video.requestPictureInPicture().catch(() => {}); };
  $('cancel').onclick = cancelAutoNext;
  $('retry').onclick = () => activeP && playStream(activeP);
  const speeds = [1, 1.25, 1.5, 2, 0.75];
  $('speed').onclick = () => { const n = speeds[(speeds.indexOf(video.playbackRate) + 1) % speeds.length]; video.playbackRate = n; $('speed').textContent = n + 'x'; };

  video.addEventListener('play', () => pp.innerHTML = '<i class="fas fa-pause"></i>');
  video.addEventListener('pause', () => pp.innerHTML = '<i class="fas fa-play"></i>');
  video.addEventListener('playing', () => { spin.style.display = 'none'; $('err').style.display = 'none'; });
  video.addEventListener('waiting', () => { if (activeP) spin.style.display = 'block'; });
  video.addEventListener('error', () => {
    if (!activeP || hls) return;
    if (!usedProxy && CONFIG.proxyBases.length) { toast('Alternatif yol deneniyor…'); playStream(activeP, true, pendingStart, 0); }
    else showError('Bağlantı kurulamadı. Kaynak kapalı olabilir.');
  });
  const volIcon = () => { const i = video.muted || video.volume === 0 ? 'mute' : video.volume < .5 ? 'down' : 'up'; mute.innerHTML = `<i class="fas fa-volume-${i}"></i>`; };
  vol.oninput = e => { video.volume = +e.target.value; video.muted = video.volume === 0; volIcon(); };
  mute.onclick = e => { e.stopPropagation(); video.muted = !video.muted; vol.value = video.muted ? 0 : video.volume; volIcon(); };

  video.addEventListener('canplay', () => {
    if (!activeP || pendingStart <= 30) return;
    const t = pendingStart; pendingStart = 0;
    setTimeout(() => { video.currentTime = t; toast('Kaldığın yerden devam ediliyor…'); }, 400);
  });
  video.addEventListener('timeupdate', () => {
    if (!activeP) return;
    const end = mediaEnd();
    if (end && +seek.max !== end) { seek.max = end; $('tot').textContent = fmt(end); }
    if (!seeking) seek.value = video.currentTime;
    $('cur').textContent = fmt(video.currentTime);
    const now = Date.now();
    if (video.currentTime > 5 && now - lastSave > 3000) { lastSave = now; store.set('ihs_resume_' + activeP.url, video.currentTime); markProgress(); }
  });
  seek.addEventListener('input', () => { seeking = true; $('cur').textContent = fmt(+seek.value); });
  seek.addEventListener('change', () => { seeking = false; seekTo(+seek.value); });

  video.addEventListener('ended', () => {
    if (!activeP) return;
    store.set('ihs_resume_' + activeP.url, 0); store.set('ihs_seen_' + activeP.url, '1');
    let n = qIndex + 1;
    if (n >= queue.length) { if (queue.loop) n = 0; else { toast('Dizinin sonu'); return; } }
    const nx = queue[n];
    $('an-name').textContent = nx.title; $('nov').style.display = 'flex';
    let c = 5; $('an-count').textContent = c;
    clearInterval(autoTimer);
    autoTimer = setInterval(() => { $('an-count').textContent = --c; if (c <= 0) { cancelAutoNext(); qIndex = n; if (nx.ep) store.set('ihs_last_' + nx.item.name, nx.url); playStream(nx); } }, 1000);
  });

  const zone = (id, ind, dir) => {
    let last = 0, timer = null;
    $(id).addEventListener('click', () => {
      const now = Date.now();
      if (now - last < 300) { clearTimeout(timer); last = 0; seekBy(10 * dir); animateTap(ind); }
      else { last = now; timer = setTimeout(togglePlay, 300); }
    });
  };
  zone('tap-l', 'ind-l', -1); zone('tap-r', 'ind-r', 1);
  video.onclick = togglePlay;

  let idleT;
  const wake = () => { vc.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => { if (!video.paused) vc.classList.add('idle'); }, 2500); };
  vc.addEventListener('mousemove', wake); vc.addEventListener('touchstart', wake, { passive: true });
  vc.addEventListener('mouseleave', () => { if (!video.paused) vc.classList.add('idle'); });

  document.addEventListener('keydown', e => {
    if (!$('player').classList.contains('open')) return;
    if (e.key === 'Escape') { closePlayer(); return; }
    const k = e.code;
    if (k === 'Space') { e.preventDefault(); togglePlay(); }
    else if (k === 'KeyF') { e.preventDefault(); toggleFullscreen(); }
    else if (k === 'KeyN') step(1);
    else if (k === 'KeyP') step(-1);
    else if (k === 'ArrowLeft') { e.preventDefault(); seekBy(e.shiftKey ? -30 : -10); }
    else if (k === 'ArrowRight') { e.preventDefault(); seekBy(e.shiftKey ? 30 : 10); }
    else if (k === 'ArrowUp' || k === 'ArrowDown') {
      e.preventDefault();
      video.volume = Math.max(0, Math.min(1, video.volume + (k === 'ArrowUp' ? .1 : -.1)));
      vol.value = video.volume; video.muted = false; volIcon();
    }
  });
  if ('mediaSession' in navigator) {
    const set = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch {} };
    set('play', () => video.play()); set('pause', () => video.pause());
    set('previoustrack', () => step(-1)); set('nexttrack', () => step(1));
    set('seekbackward', () => seekBy(-10)); set('seekforward', () => seekBy(10));
  }
}

/* ===== OYNATMA ===== */
function embedFor(url) {
  let m;
  if (url.includes('ok.ru/video/')) return 'https://ok.ru/videoembed/' + url.split('/video/')[1].split('?')[0];
  if ((m = url.match(/youtube\.com\/watch\?v=([^&]+)/)) || (m = url.match(/youtu\.be\/([^?]+)/))) return 'https://www.youtube.com/embed/' + m[1];
  if (url.includes('vixolity.com/vs/') || url.includes('/embed/') || url.includes('player.php')) return url;
  return null;
}
const proxyList = url => CONFIG.proxyBases.filter(Boolean).map(b => b + encodeURIComponent(url));
const needsProxy = url => ['daioncdn', 'turknet', 'token=', 'sid=', 'ercdn', 'harborstatic'].some(d => url.includes(d));

function playStream(p, forceProxy, startAt, proxyIndex = 0) {
  usedProxy = !!forceProxy;
  if (startAt === undefined) { const s = resumeOf(p.url); startAt = s > 30 ? s : 0; }
  pendingStart = startAt || 0;
  stopPlayback();
  activeP = p; $('ptitle').textContent = p.title;
  $('player').classList.add('open'); document.body.classList.add('lock');
  if ('mediaSession' in navigator && window.MediaMetadata) navigator.mediaSession.metadata = new MediaMetadata({ title: p.title, artist: 'IHS' });
  spin.style.display = 'block';

  const embed = embedFor(p.url);
  if (embed) {
    vc.classList.add('embed'); video.style.display = 'none'; $('controls').style.display = 'none';
    const f = document.createElement('iframe');
    f.id = 'ihs-iframe'; f.src = embed + (embed.includes('?') ? '&' : '?') + 'autoplay=1';
    f.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture'; f.allowFullscreen = true;
    f.style.cssText = 'width:100%;height:100%;border:0;position:absolute;inset:0;z-index:5';
    vc.appendChild(f); spin.style.display = 'none'; return;
  }

  let src = p.url;
  const proxies = proxyList(p.url);
  const mixed = location.protocol === 'https:' && src.startsWith('http:');
  if (mixed || needsProxy(src) || forceProxy) { src = proxies[proxyIndex] || src; usedProxy = !!proxies[proxyIndex]; }

  const isHls = /\.m3u8(?:[?#].*)?$/i.test(p.url);
  if (isHls && window.Hls && Hls.isSupported()) {
    let netRetries = 0, mediaRetries = 0;
    hls = new Hls({
      enableWorker: true, lowLatencyMode: false, backBufferLength: 60, maxBufferLength: 60, maxMaxBufferLength: 300,
      maxBufferSize: 60 * 1024 * 1024, manifestLoadingTimeOut: 20000, manifestLoadingMaxRetry: 3,
      levelLoadingTimeOut: 20000, levelLoadingMaxRetry: 3, fragLoadingTimeOut: 30000, fragLoadingMaxRetry: 5
    });
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
    hls.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal) return;
      if (d.type === Hls.ErrorTypes.NETWORK_ERROR) {
        if (netRetries++ < CONFIG.hlsRetries) { hls.startLoad(); return; }
        if (proxies[proxyIndex + 1]) { hls.destroy(); hls = null; toast('Yedek yol deneniyor…'); playStream(p, true, pendingStart, proxyIndex + 1); return; }
        if (!usedProxy && proxies[0]) { hls.destroy(); hls = null; toast('Alternatif proxy deneniyor…'); playStream(p, true, pendingStart, 0); return; }
      } else if (d.type === Hls.ErrorTypes.MEDIA_ERROR && mediaRetries++ < CONFIG.hlsRetries) { hls.recoverMediaError(); return; }
      showError('Bağlantı kurulamadı. Kaynak geçici olarak kapalı olabilir.');
    });
    hls.loadSource(src); hls.attachMedia(video);
  } else { video.src = src; video.play().catch(() => {}); }
}
window.addEventListener('beforeunload', () => { if (activeP && video.currentTime > 5) store.set('ihs_resume_' + activeP.url, video.currentTime); });
</script>
